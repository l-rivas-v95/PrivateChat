# Bloques a añadir DENTRO del `server { listen 443 ssl; ... }` de
# /etc/nginx/sites-available/lrivasvilla95
#
# No hay que quitar ni cambiar nada de lo que ya tienes. Todo esto es nuevo.
# Pégalo justo antes del cierre del bloque, después de `location /swapcloset/`.


    # Los ficheros de la web viven en /var/www/privatechat/
    # (esta línea va a nivel de server, no dentro de un location)
    root /var/www;

    # Sin la barra final no casaría ninguna location y daría 404
    location = /privatechat {
        return 301 /privatechat/;
    }

    # Vite pone un hash en el nombre de cada asset, así que nunca cambian
    # de contenido: se pueden cachear para siempre.
    location /privatechat/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Estos tres son los que traen las actualizaciones. Si se cachean, el
    # usuario se queda clavado en la versión vieja.
    location = /privatechat/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /privatechat/sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /privatechat/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # La app. Va después de /privatechat/apk en especificidad, así que la
    # página de descarga del APK sigue funcionando igual que hasta ahora.
    location /privatechat/ {
        try_files $uri $uri/ /privatechat/index.html;
    }
