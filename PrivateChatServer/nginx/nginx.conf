events {
    worker_connections 1024;
}

http {

    # Redirigir HTTP → HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        # Coloca aquí la ruta a tus certificados SSL (montados como volumen en docker-compose)
        ssl_certificate     /etc/letsencrypt/live/lrivasvilla95.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lrivasvilla95.duckdns.org/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # WebSocket: wss:// → ws:// interno
        location /chat {
            proxy_pass http://privatechat:8080/chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # REST: subida y descarga de ficheros cifrados
        location /upload {
            proxy_pass http://privatechat:8080/upload;
            proxy_set_header Host $host;
            client_max_body_size 10M;
        }

        location /file/ {
            proxy_pass http://privatechat:8080/file/;
            proxy_set_header Host $host;
        }

        # Página de descarga + APK
        location /privatechat/apk {
            proxy_pass http://privatechat:8080/privatechat/apk;
            proxy_set_header Host $host;
            client_max_body_size 100M;
        }
    }
}
