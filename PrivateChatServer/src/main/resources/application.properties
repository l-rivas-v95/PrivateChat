spring.application.name=PrivateChatServer
server.address=0.0.0.0
server.port=8080

# Base de datos H2 en fichero (persiste entre reinicios)
spring.datasource.url=jdbc:h2:file:/data/privatechat
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Almacenamiento de ficheros cifrados
app.files.storage-path=/data/files
app.files.max-size-bytes=10485760

# Limite de payload multipart (10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
