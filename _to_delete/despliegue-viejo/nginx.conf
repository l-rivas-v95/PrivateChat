events {
    worker_connections 1024;
}

http {

    # NUEVO Y OBLIGATORIO al servir ficheros estáticos.
    # Sin esto nginx manda todo como application/octet-stream: el navegador
    # se niega a ejecutar el JS (los módulos ES comprueban el MIME) e ignora
    # el CSS. Verías una página en blanco. Antes daba igual porque nginx solo
    # hacía de proxy y los tipos los ponía Spring.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Redirigir HTTP → HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        # Coloca aquí la ruta a tus certificados SSL (montados como volumen en docker-compose)
        ssl_certificate     /etc/letsencrypt/live/lrivasvilla95.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lrivasvilla95.duckdns.org/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # NUEVO: de dónde salen los ficheros de la web compilada.
        # Se monta como volumen desde ./web en el docker-compose.
        root  /usr/share/nginx/html;
        index index.html;

        # ------------------------------------------------------------------
        # API. Todo esto ya lo tenías y no cambia.
        # Son locations más específicas que "/", así que ganan siempre.
        # ------------------------------------------------------------------

        # WebSocket: wss:// → ws:// interno
        location /chat {
            proxy_pass http://privatechat:8080/chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # REST: subida y descarga de ficheros cifrados
        location /upload {
            proxy_pass http://privatechat:8080/upload;
            proxy_set_header Host $host;
            client_max_body_size 10M;
        }

        location /file/ {
            proxy_pass http://privatechat:8080/file/;
            proxy_set_header Host $host;
        }

        # Página de descarga + APK
        location /privatechat/apk {
            proxy_pass http://privatechat:8080/privatechat/apk;
            proxy_set_header Host $host;
            client_max_body_size 100M;
        }

        # ------------------------------------------------------------------
        # NUEVO: la web en React
        # ------------------------------------------------------------------

        # Vite pone un hash en el nombre de cada fichero de /assets/, así que
        # nunca cambian de contenido: se pueden cachear para siempre.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Estos tres son los que traen las actualizaciones. Si se cachean, el
        # usuario se queda clavado en la versión vieja para siempre.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location = /sw.js {
            add_header Cache-Control "no-cache";
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # Cualquier otra ruta devuelve el index para que se encargue React.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
