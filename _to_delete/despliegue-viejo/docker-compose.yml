services:

  privatechat:
    image: luisrivi95/privatechat-server:latest
    expose:
      - "8080"
    volumes:
      - privatechat_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # NUEVO: la web compilada. Es lo único que cambia de este fichero.
      # Solo lectura: nginx no tiene por qué poder escribir ahí.
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - privatechat
    restart: unless-stopped

volumes:
  privatechat_data:
